<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
  <title>Three Flavors of XSS</title>
  <style>
    body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif;
      background: #ffffff; color: #37474f; }
    main { display: block; width: 100%; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 10px 12px; }
    h1 { font-size: 22px; text-align: center; color: #1565c0; margin: 6px 0 2px; }
    .sub { text-align: center; font-size: 13px; color: #607d8b; margin: 0 0 6px; }
    svg.diagram { display: block; width: 100%; max-width: 980px; height: auto; margin: 0 auto; }
    [data-tip] { cursor: help; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px;
      font-size: 12px; color: #455a64; margin: 4px 0 6px; }
    .legend span { display: inline-flex; align-items: center; }
    .legend .swatch { width: 14px; height: 14px; border-radius: 3px; margin-right: 5px;
      border: 1px solid #90a4ae; }
    .tooltip { position: fixed; pointer-events: none; z-index: 50; background: #263238;
      color: #fff; font-size: 12px; line-height: 1.4; padding: 7px 10px; border-radius: 6px;
      max-width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,.3); opacity: 0; transition: opacity .08s; }
    .tooltip b { color: #ffd180; }
    .tooltip code { background: #455a64; color: #fff8e1; padding: 0 3px; border-radius: 3px;
      font-size: 11.5px; }
  </style>
  <script src="xss-three-flavors.js" defer></script>
</head>
<body>
  <main>
    <div class="wrap">
      <h1>Three Flavors of XSS</h1>
      <p class="sub">Stored, reflected, and DOM-based cross-site scripting differ in <em>where the payload lives</em> and <em>whether the server ever sees it</em>. Hover (or tap) any step.</p>
      <div class="legend">
        <span><span class="swatch" style="background:#1565c0"></span>Legitimate flow</span>
        <span><span class="swatch" style="background:#ffa000"></span>Attacker-controlled data</span>
        <span><span class="swatch" style="background:#fff;border:2px solid #c62828"></span>Script executes in victim's browser</span>
      </div>
      <div id="diagram"></div>
    </div>
  </main>
  <div class="tooltip" id="tip"></div>
  <br/>
  <a href=".">Back to Documentation</a>
</body>
</html>
