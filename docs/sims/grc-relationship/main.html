<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>GRC Relationship: Governance, Risk, Compliance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: aliceblue; color: #212529; overflow: hidden;
        }
        main { display: block; width: 100%; height: 100%; }
        #wrap { width: 100%; height: 100%; padding: 8px 10px; display: flex; flex-direction: column; }
        h1 { font-size: 19px; color: #0d47a1; text-align: center; margin-bottom: 2px; }
        .subtitle { font-size: 12.5px; color: #455a64; text-align: center; margin-bottom: 4px; }
        #vennHost { flex: 1; width: 100%; position: relative; min-height: 0; }
        svg { width: 100%; height: 100%; display: block; }
        .region { cursor: pointer; }
        .label { font-weight: 700; pointer-events: none; }
        .sublabel { pointer-events: none; }
        .caption {
            font-size: 12.5px; color: #37474f; text-align: center;
            padding: 6px 10px 2px 10px; line-height: 1.35;
        }
        #tooltip {
            position: fixed; pointer-events: none; max-width: 260px;
            background: #fff; color: #263238;
            border: 1px solid #455a64; border-radius: 6px;
            padding: 8px 10px; font-size: 12.5px; line-height: 1.4;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            opacity: 0; transition: opacity 0.12s; z-index: 50;
        }
        #tooltip .tt-title { font-weight: 700; margin-bottom: 4px; color: #0d47a1; }
    </style>
</head>
<body>
    <main>
    <div id="wrap">
        <h1>Governance, Risk &amp; Compliance (GRC)</h1>
        <div class="subtitle">Hover or tap a region for its definition</div>
        <div id="vennHost"></div>
        <div class="caption">
            An organization can be compliant and still insecure. Compliance is
            evidence; risk is reality; governance is who decides between them.
        </div>
    </div>
    <div id="tooltip"></div>
    </main>
    <script src="grc-relationship.js"></script>
</body>
</html>
