<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Kernel / User Mode Boundary</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8e1; color: #212529; overflow: hidden;
        }
        main { display: block; width: 100%; height: 100%; }
        #wrap { width: 100%; height: 100%; padding: 8px 12px; display: flex; flex-direction: column; }
        h1 { font-size: 20px; color: #0d47a1; text-align: center; margin-bottom: 2px; }
        .subtitle { font-size: 13px; color: #455a64; text-align: center; margin-bottom: 6px; }
        #svgHost { flex: 1; width: 100%; position: relative; min-height: 0; }
        svg { width: 100%; height: 100%; display: block; }
        .hot { cursor: pointer; }
        .hot > rect, .hot > line { transition: opacity 0.12s; }
        .hot:hover { opacity: 0.9; }
        text { pointer-events: none; }
        #tooltip {
            position: fixed; pointer-events: none; max-width: 280px;
            background: #fff; color: #263238;
            border: 1px solid #455a64; border-radius: 6px;
            padding: 8px 10px; font-size: 12.5px; line-height: 1.4;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            opacity: 0; transition: opacity 0.12s; z-index: 50;
        }
        #tooltip .tt-title { font-weight: 700; margin-bottom: 4px; color: #0d47a1; }
    </style>
</head>
<body>
    <main>
    <div id="wrap">
        <h1>Kernel / User Mode Boundary</h1>
        <div class="subtitle">Hover a layer to learn why the boundary matters. The system call interface is the only legal door.</div>
        <div id="svgHost"></div>
    </div>
    <div id="tooltip"></div>
    </main>
    <script src="kernel-user-boundary.js"></script>
</body>
</html>
