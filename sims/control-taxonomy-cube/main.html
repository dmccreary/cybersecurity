<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Security Control 3D Taxonomy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: aliceblue;
            color: #212529;
            overflow: hidden;
        }
        main { display: block; width: 100%; height: 100%; }
        #wrap { width: 100%; height: 100%; padding: 8px 10px; }
        h1 {
            font-size: 19px; color: #0d47a1; text-align: center;
            margin-bottom: 2px;
        }
        .subtitle { font-size: 12.5px; color: #455a64; text-align: center; margin-bottom: 8px; }
        #grid {
            display: grid;
            grid-template-columns: 130px 1fr 1fr 1fr;
            gap: 6px;
            width: 100%;
        }
        .corner { background: transparent; }
        .col-head, .row-head {
            font-weight: 600; font-size: 13px; color: #fff;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 6px; border-radius: 4px;
        }
        .col-head { background: #37474f; }
        .row-head { background: #607d8b; }
        .cell {
            border-radius: 5px; padding: 7px 8px; color: #fff;
            cursor: pointer; min-height: 64px;
            border: 2px solid rgba(255,255,255,0.35);
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .cell:hover { transform: translateY(-2px); box-shadow: 0 3px 8px rgba(0,0,0,0.25); border-color: #fff; }
        .cell .examples { font-size: 12px; line-height: 1.3; }
        .cell .examples span { display: block; }
        .legend {
            display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
            margin-top: 10px; font-size: 12.5px; color: #37474f;
        }
        .legend-item { display: flex; align-items: center; }
        .legend-dot { width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; }
        #tooltip {
            position: fixed; pointer-events: none; max-width: 280px;
            background: #ffffff; color: #263238;
            border: 1px solid #455a64; border-radius: 6px;
            padding: 8px 10px; font-size: 12.5px; line-height: 1.4;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            opacity: 0; transition: opacity 0.12s; z-index: 50;
        }
        #tooltip .tt-title { font-weight: 700; margin-bottom: 4px; color: #0d47a1; }
        @media (max-width: 700px) {
            html, body { overflow: auto; }
            #grid { grid-template-columns: 1fr; }
            .col-head { display: none; }
            .row-head { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <main>
    <div id="wrap">
        <h1>Security Control Taxonomy</h1>
        <div class="subtitle">Rows = control function &nbsp;|&nbsp; Columns = control type &nbsp;|&nbsp; hover a cell for more examples</div>
        <div id="grid"></div>
        <div class="legend" id="legend"></div>
    </div>
    <div id="tooltip"></div>
    </main>
    <script src="control-taxonomy-cube.js"></script>
</body>
</html>
